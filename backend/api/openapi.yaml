openapi: 3.0.3
info:
  title: OralHistory 口述历史采集工具 API
  description: 口述历史采集工具后端接口文档（Go 1.22 + Gin + GORM）
  version: 1.0.0
servers:
  - url: http://localhost:9180/api/v1
paths:
  /auth/register:
    post:
      summary: 用户注册
      tags: [auth]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                password: { type: string }
                display_name: { type: string }
                email: { type: string }
                role: { type: string, enum: [admin, interviewer, archivist] }
      responses:
        '200': { description: 注册成功 }
  /auth/login:
    post:
      summary: 用户登录
      tags: [auth]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: 登录成功，返回 token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
  /auth/me:
    get:
      summary: 当前用户信息
      tags: [auth]
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: 用户信息 }
  /projects:
    get:
      summary: 项目列表（可按 status 筛选）
      tags: [projects]
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: page_size, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string } }
    post:
      summary: 创建采访项目
      tags: [projects]
      security: [{ BearerAuth: [] }]
  /projects/{id}:
    get: { summary: 项目详情, tags: [projects], security: [{ BearerAuth: [] }] }
    put: { summary: 更新项目, tags: [projects], security: [{ BearerAuth: [] }] }
    delete: { summary: 删除项目, tags: [projects], security: [{ BearerAuth: [] }] }
  /projects/{id}/status:
    put:
      summary: 项目状态流转
      tags: [projects]
      security: [{ BearerAuth: [] }]
  /projects/{projectId}/questions:
    get: { summary: 项目问题列表, tags: [questions], security: [{ BearerAuth: [] }] }
    post: { summary: 添加问题, tags: [questions], security: [{ BearerAuth: [] }] }
  /questions/{id}:
    put: { summary: 更新问题, tags: [questions], security: [{ BearerAuth: [] }] }
    delete: { summary: 删除问题, tags: [questions], security: [{ BearerAuth: [] }] }
  /questions/{id}/recordings/reorder:
    put:
      summary: 保存某问题下录音片段的人工排序（上移/下移后的完整顺序）
      description: recording_ids 必须是该问题当前全部片段、不重复、不跨问题；保存后采访工作台与项目时间线均按新顺序播放。
      tags: [recordings]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recording_ids]
              properties:
                recording_ids:
                  type: array
                  minItems: 1
                  items: { type: integer, format: uint64 }
                  example: [12, 10, 11]
      responses:
        '200':
          description: 排序已保存，返回该问题重排后的片段列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: 录音顺序已保存 }
                  data:
                    type: object
                    properties:
                      list:
                        type: array
                        items: { $ref: '#/components/schemas/Recording' }
        '409': { description: 提交集合与库中集合不一致（有新增/删除/跨问题混入） }
  /recordings:
    get:
      summary: 录音列表（project_id 或 question_id）
      tags: [recordings]
      security: [{ BearerAuth: [] }]
    post: { summary: 创建录音记录, tags: [recordings], security: [{ BearerAuth: [] }] }
  /recordings/{id}:
    get: { summary: 录音详情, tags: [recordings], security: [{ BearerAuth: [] }] }
    put: { summary: 更新录音, tags: [recordings], security: [{ BearerAuth: [] }] }
    delete: { summary: 删除录音, tags: [recordings], security: [{ BearerAuth: [] }] }
  /recordings/{id}/audio:
    post: { summary: 上传录音文件(multipart), tags: [recordings], security: [{ BearerAuth: [] }] }
    get: { summary: 播放录音音频流, tags: [recordings], security: [{ BearerAuth: [] }] }
  /timeline-markers:
    get:
      summary: 时间轴节点列表（project_id 或 recording_id）
      tags: [timeline]
      security: [{ BearerAuth: [] }]
    post: { summary: 标注时间轴节点, tags: [timeline], security: [{ BearerAuth: [] }] }
  /timeline-markers/{id}:
    put: { summary: 更新时间轴节点, tags: [timeline], security: [{ BearerAuth: [] }] }
    delete: { summary: 删除时间轴节点, tags: [timeline], security: [{ BearerAuth: [] }] }
  /audit-logs:
    get:
      summary: 审计日志列表（仅管理员）
      tags: [audit]
      security: [{ BearerAuth: [] }]
  /users:
    get: { summary: 用户列表（仅管理员）, tags: [users], security: [{ BearerAuth: [] }] }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Recording:
      type: object
      properties:
        id: { type: integer, format: uint64 }
        project_id: { type: integer, format: uint64 }
        question_id: { type: integer, format: uint64 }
        audio_key: { type: string }
        duration_seconds: { type: integer }
        summary: { type: string }
        status: { type: string, enum: [recording, processing, ready, failed] }
        sort_order: { type: integer, description: 问题内人工排序，从 0 开始；新录音追加到末尾 }
        created_by: { type: integer, format: uint64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
